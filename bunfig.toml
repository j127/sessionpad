telemetry = false

[install]
# Minimum publish age (seconds) before a version is installable (Bun >= 1.3).
# 1 week
minimumReleaseAge = 604800
# Pin exact versions in package.json (no ^ / ~) to reduce drift.
exact = true
# Note: Bun runs dependency lifecycle scripts only for packages listed in
# `"trustedDependencies"` in package.json. If that field is absent, Bun
# trusts its built-in list of popular npm packages instead (e.g. esbuild,
# sharp; see `bun pm default-trusted`). Add `"trustedDependencies": []` to
# package.json to trust none of them, then allow a package after review
# with `bun pm trust <pkg>` (`bun pm untrusted` lists blocked scripts).

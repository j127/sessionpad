# CI runs only on pull requests into main that are ready for review, so draft
# pull requests and pull requests into feature branches spend no GitHub
# Actions minutes. Work on those is checked locally instead: run `just check`
# before pushing, and with the github-flow plugin, worker pull requests get
# the `github-flow/checks` status from its local_checks.ts. Mark a pull
# request ready when you want CI to run and the pull request merged.
name: CI

on:
  pull_request:
    branches: [main]
    # ready_for_review starts the first run when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  # A run by hand, for example after fixing the account's Actions billing.
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the run for the push before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Skip drafts. A skipped job uses no minutes. Only a pull_request event
    # has a pull request to ask.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs, so a moved tag cannot change
      # what runs here. The comment names the version each SHA is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      # Set up the project's toolchain here. Bun is the default; replace or
      # add steps for other languages.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: hashFiles('bun.lock') != ''
      - run: bun install --frozen-lockfile
        if: hashFiles('bun.lock') != ''
      # The claude CLI validates the mod and runs its tests. It is pinned to
      # the oldest release that loads the mod, the minimum the README names,
      # so CI checks that promise and a new release can't change what CI
      # runs; raise it, and the minimum, on purpose.
      - run: bun add --global @anthropic-ai/claude-code@2.1.299
      - run: claude --version
      # The justfile's check recipe is the one list of checks, run the same
      # way here and on your machine.
      - run: just check
